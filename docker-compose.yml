services: 
  mail_service:
    build: .
    environment:
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
    networks:
      - project_network 

  mailing_heartbeat:
    build:
      context: ./publisher
      dockerfile: Dockerfile  #Dockerfile specifiek voor heartbeat
    environment:
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
    networks:
      - project_network
    restart: always  # Optioneel, handig bij crashes


networks:
  project_network:
    driver: bridge